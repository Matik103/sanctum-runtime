apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sanctum-runtime.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sanctum-runtime.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "sanctum-runtime.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "sanctum-runtime.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        # Force a rolling restart when the secret changes.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "sanctum-runtime.serviceAccountName" . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["npm", "run", "start", "-w", "@sanctum/api"]
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            # ── Runtime ────────────────────────────────────────────────────
            - name: NODE_ENV
              value: {{ .Values.api.env.NODE_ENV | quote }}
            - name: PORT
              value: "3000"
            - name: HOST
              value: "0.0.0.0"

            # ── Supabase ───────────────────────────────────────────────────
            - name: VITE_SUPABASE_URL
              value: {{ .Values.supabase.url | quote }}
            - name: VITE_SUPABASE_ANON_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "sanctum-runtime.secretName" . }}
                  key: supabase-anon-key
            - name: SUPABASE_SERVICE_ROLE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "sanctum-runtime.secretName" . }}
                  key: supabase-service-role-key
            - name: VITE_SUPABASE_SERVICE_ROLE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "sanctum-runtime.secretName" . }}
                  key: supabase-service-role-key

            # ── API auth ───────────────────────────────────────────────────
            - name: SANCTUM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "sanctum-runtime.secretName" . }}
                  key: sanctum-api-key
            - name: SANCTUM_API_KEY_PEPPER
              valueFrom:
                secretKeyRef:
                  name: {{ include "sanctum-runtime.secretName" . }}
                  key: sanctum-api-key-pepper

            # ── URLs ───────────────────────────────────────────────────────
            - name: SANCTUM_PUBLIC_API_URL
              value: {{ .Values.api.env.SANCTUM_PUBLIC_API_URL | quote }}
            - name: DASHBOARD_URL
              value: {{ .Values.api.env.DASHBOARD_URL | quote }}
            - name: SANCTUM_DOCS_URL
              value: {{ .Values.api.env.SANCTUM_DOCS_URL | quote }}

            # ── CORS ───────────────────────────────────────────────────────
            - name: SANCTUM_CORS_ORIGINS
              value: {{ .Values.api.env.SANCTUM_CORS_ORIGINS | quote }}

            # ── Risk model ─────────────────────────────────────────────────
            - name: SANCTUM_OFFLINE_MODE
              value: {{ .Values.api.env.SANCTUM_OFFLINE_MODE | quote }}
            - name: SANCTUM_RISK_PROVIDER
              value: {{ .Values.api.env.SANCTUM_RISK_PROVIDER | quote }}
            {{- if .Values.ollama.enabled }}
            - name: OLLAMA_BASE_URL
              value: {{ .Values.ollama.url | quote }}
            {{- end }}

            # ── Paddle billing (optional) ──────────────────────────────────
            - name: PADDLE_SANDBOX
              value: {{ .Values.api.env.PADDLE_SANDBOX | quote }}
            - name: PADDLE_VENDOR_ID
              value: {{ .Values.api.env.PADDLE_VENDOR_ID | quote }}
            - name: PADDLE_PRODUCT_OPERATOR
              value: {{ .Values.api.env.PADDLE_PRODUCT_OPERATOR | quote }}
            - name: PADDLE_PRODUCT_TEAM
              value: {{ .Values.api.env.PADDLE_PRODUCT_TEAM | quote }}
            - name: PADDLE_PRODUCT_ENTERPRISE
              value: {{ .Values.api.env.PADDLE_PRODUCT_ENTERPRISE | quote }}
            - name: PADDLE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "sanctum-runtime.secretName" . }}
                  key: paddle-webhook-secret

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}

          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

---
{{- if .Values.dashboard.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sanctum-runtime.fullname" . }}-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sanctum-runtime.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "sanctum-runtime.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        {{- include "sanctum-runtime.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: dashboard
    spec:
      securityContext:
        runAsNonRoot: false   # nginx requires root to bind port 80
      containers:
        - name: dashboard
          image: "{{ .Values.dashboard.image.repository }}:{{ .Values.dashboard.image.tag }}"
          imagePullPolicy: {{ .Values.dashboard.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
{{- end }}
