apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sanctum-runtime.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sanctum-runtime.labels" . | nindent 4 }}
type: Opaque
data:
  {{- /*
    supabase-service-role-key — must be supplied in values.supabase.serviceRoleKeySecretRef
    or directly here via --set. We base64-encode whatever is provided.
  */}}
  supabase-service-role-key: {{ .Values.supabase.serviceRoleKey | default "" | b64enc | quote }}

  {{- /*
    sanctum-api-key — auto-generate a 32-char random string if not provided.
  */}}
  sanctum-api-key: {{ .Values.sanctumApiKey | default (randAlphaNum 32) | b64enc | quote }}

  {{- /*
    sanctum-api-key-pepper — optional additional pepper for key hashing.
  */}}
  sanctum-api-key-pepper: {{ .Values.sanctumApiKeyPepper | default (randAlphaNum 32) | b64enc | quote }}

  {{- /*
    creem-webhook-secret — optional; empty string if not set.
  */}}
  creem-webhook-secret: {{ .Values.creemWebhookSecret | default "" | b64enc | quote }}

  {{- /*
    supabase-anon-key — stored in secret so it is not exposed via ConfigMap.
  */}}
  supabase-anon-key: {{ .Values.supabase.anonKey | default "" | b64enc | quote }}
