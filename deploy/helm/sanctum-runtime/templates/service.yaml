apiVersion: v1
kind: Service
metadata:
  name: {{ include "sanctum-runtime.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sanctum-runtime.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "sanctum-runtime.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api

---
{{- if .Values.dashboard.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sanctum-runtime.fullname" . }}-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sanctum-runtime.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  type: {{ .Values.dashboard.service.type }}
  ports:
    - port: {{ .Values.dashboard.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "sanctum-runtime.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
{{- end }}
