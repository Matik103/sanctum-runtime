# Sanctum Runtime — Production Docker Compose
# Self-hosted / air-gap deployment
#
# Usage:
#   cp .env.example .env && edit .env
#   docker compose -f deploy/docker-compose.prod.yml up -d
#
# With Ollama (local risk model):
#   docker compose -f deploy/docker-compose.prod.yml --profile with-ollama up -d

version: "3.9"

services:
  # ---------------------------------------------------------------------------
  # Sanctum API — Fastify Node.js backend
  # ---------------------------------------------------------------------------
  api:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ..:/app:ro
      - /app/node_modules          # anonymous volume — keeps container modules
    command: ["npm", "run", "start", "-w", "@sanctum/api"]
    ports:
      - "${API_EXTERNAL_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: "0.0.0.0"

      # Supabase (required — set in .env or pass directly)
      VITE_SUPABASE_URL: "${VITE_SUPABASE_URL}"
      VITE_SUPABASE_ANON_KEY: "${VITE_SUPABASE_ANON_KEY}"
      SUPABASE_SERVICE_ROLE_KEY: "${SUPABASE_SERVICE_ROLE_KEY:-}"
      VITE_SUPABASE_SERVICE_ROLE_KEY: "${VITE_SUPABASE_SERVICE_ROLE_KEY:-}"

      # API auth
      SANCTUM_API_KEY: "${SANCTUM_API_KEY:-}"
      SANCTUM_API_KEY_PEPPER: "${SANCTUM_API_KEY_PEPPER:-}"

      # URLs
      SANCTUM_PUBLIC_API_URL: "${SANCTUM_PUBLIC_API_URL:-http://localhost:3000}"
      DASHBOARD_URL: "${DASHBOARD_URL:-http://localhost:80}"
      SANCTUM_DOCS_URL: "${SANCTUM_DOCS_URL:-https://www.sanctumruntime.com/docs}"

      # CORS — comma-separated allowed origins
      SANCTUM_CORS_ORIGINS: "${SANCTUM_CORS_ORIGINS:-http://localhost:80,http://localhost:3000}"

      # Risk model
      SANCTUM_OFFLINE_MODE: "${SANCTUM_OFFLINE_MODE:-false}"
      SANCTUM_RISK_PROVIDER: "${SANCTUM_RISK_PROVIDER:-none}"

      # Ollama (only used when SANCTUM_RISK_PROVIDER=ollama)
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://ollama:11434}"

      # Paddle billing (optional)
      PADDLE_VENDOR_ID: "${PADDLE_VENDOR_ID:-}"
      PADDLE_WEBHOOK_SECRET: "${PADDLE_WEBHOOK_SECRET:-}"
      PADDLE_SANDBOX: "${PADDLE_SANDBOX:-false}"
      PADDLE_PRODUCT_OPERATOR: "${PADDLE_PRODUCT_OPERATOR:-}"
      PADDLE_PRODUCT_TEAM: "${PADDLE_PRODUCT_TEAM:-}"
      PADDLE_PRODUCT_ENTERPRISE: "${PADDLE_PRODUCT_ENTERPRISE:-}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_started
        required: false
    networks:
      - sanctum

  # ---------------------------------------------------------------------------
  # Sanctum Dashboard — Nginx serving pre-built Vite SPA
  # ---------------------------------------------------------------------------
  dashboard:
    image: nginx:alpine
    volumes:
      - ../apps/dashboard/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - sanctum

  # ---------------------------------------------------------------------------
  # Ollama — local LLM for risk model (optional, use --profile with-ollama)
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    profiles:
      - with-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    restart: unless-stopped
    networks:
      - sanctum

volumes:
  ollama_data:
    driver: local

networks:
  sanctum:
    driver: bridge
    internal: false
