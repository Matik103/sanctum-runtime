# Render Blueprint — Sanctum production stack
# https://render.com/docs/blueprint-spec
#
# Deploy: Render Dashboard → New → Blueprint → connect repo
# Or add services manually using PRODUCTION_OPS.md

services:
  - type: web
    name: sanctum-api
    runtime: node
    repo: https://github.com/Matik103/sanctum-runtime
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build:sdk && npm run build:packages
    startCommand: npm run start -w @sanctum/api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SANCTUM_OFFLINE_MODE
        value: "false"
      - key: SANCTUM_RISK_PROVIDER
        value: "openai"
      - key: SANCTUM_RISK_MODEL
        value: "gpt-4o-mini"
      - key: OPENAI_API_KEY
        sync: false
      - key: SANCTUM_API_KEY
        generateValue: true
      - key: SANCTUM_API_KEY_PEPPER
        generateValue: true
      - key: SANCTUM_ACTION_TOKEN_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:ops@sanctumruntime.com
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFICATION_FROM_EMAIL
        value: "Sanctum Runtime Alerts <alerts@sanctumruntime.com>"
      # Paddle billing (Paddle Billing v2 — checkout.paddle.com).
      # PADDLE_SANDBOX=true for sandbox-checkout.paddle.com during testing.
      - key: PADDLE_VENDOR_ID
        sync: false
      - key: PADDLE_WEBHOOK_SECRET
        sync: false
      - key: PADDLE_PRODUCT_OPERATOR
        sync: false
      - key: PADDLE_PRODUCT_TEAM
        sync: false
      - key: PADDLE_PRODUCT_ENTERPRISE
        sync: false
      - key: PADDLE_SANDBOX
        value: "false"
      - key: DASHBOARD_URL
        value: https://console.sanctumruntime.com
      - key: SANCTUM_PUBLIC_API_URL
        value: https://api.sanctumruntime.com

  - type: web
    name: sanctum-dashboard
    runtime: static
    repo: https://github.com/Matik103/sanctum-runtime
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build:sdk && npm run build -w @sanctum/dashboard
    staticPublishPath: apps/dashboard/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # Strengthen the noindex signal at the HTTP level so search engines
    # (and AI crawlers) get the directive on every response — even cached
    # ones, redirects, and non-HTML assets where <meta> wouldn't apply.
    headers:
      - path: /*
        name: X-Robots-Tag
        value: "noindex, nofollow, noarchive, nosnippet"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=63072000; includeSubDomains; preload"
      - path: /*
        name: X-Content-Type-Options
        value: "nosniff"
      - path: /*
        name: X-Frame-Options
        value: "DENY"
      - path: /*
        name: Referrer-Policy
        value: "strict-origin-when-cross-origin"
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=()"
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src 'self' fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://api.sanctumruntime.com wss://api.sanctumruntime.com https://*.supabase.co wss://*.supabase.co https://fcm.googleapis.com; frame-ancestors 'none'; base-uri 'self'; upgrade-insecure-requests;"
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: "same-origin"
      - path: /*
        name: Cross-Origin-Embedder-Policy
        value: "credentialless"
      # Long-cache hashed bundles (Vite emits *.<hash>.{js,css}); HTML stays uncached
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      - path: /*.js
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      - path: /*.css
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      - path: /*.woff2
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      - path: /*.png
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      - path: /*.svg
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      # HTML and the SW must always revalidate so users pick up new deploys
      - path: /index.html
        name: Cache-Control
        value: "public, max-age=0, must-revalidate"
      - path: /sw.js
        name: Cache-Control
        value: "public, max-age=0, must-revalidate"
      - path: /sw.mjs
        name: Cache-Control
        value: "public, max-age=0, must-revalidate"
      - path: /manifest.webmanifest
        name: Cache-Control
        value: "public, max-age=3600, must-revalidate"
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_SANCTUM_API_URL
        value: https://api.sanctumruntime.com
      - key: VITE_DOCS_URL
        value: https://www.sanctumruntime.com/docs
      - key: VITE_MARKETING_URL
        value: https://www.sanctumruntime.com
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
