<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#070b14" />
  <title>Offline — Sanctum</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100dvh;display:flex;align-items:center;justify-content:center;background:#070b14;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#a1a1aa;padding:2rem}
    .card{text-align:center;max-width:22rem}
    .icon{width:48px;height:48px;margin:0 auto 1.25rem;opacity:.4}
    h1{font-size:1.125rem;font-weight:600;color:#f4f4f5;margin-bottom:.5rem}
    p{font-size:.875rem;line-height:1.6;color:#71717a}
    button{margin-top:1.5rem;padding:.5rem 1.25rem;border-radius:6px;border:1px solid #27272a;background:#111113;color:#e4e4e7;font-size:.875rem;cursor:pointer}
    button:hover{background:#18181b}
  </style>
</head>
<body>
  <div class="card">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18M8.288 8.288A5.25 5.25 0 0112 7.5c2.9 0 5.25 2.35 5.25 5.25 0 .47-.065.926-.188 1.36M6.75 12.75a5.25 5.25 0 005.25 5.25M12 21v-2.25M12 3v2.25M3 12h2.25M18.75 12H21" />
    </svg>
    <h1>You're offline</h1>
    <p>No internet connection. Check your network and try again — your data will be here when you're back.</p>
    <button onclick="window.location.reload()">Try again</button>
  </div>
</body>
</html>
