<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sanctum Runtime — Console</title>
    <meta
      name="description"
      content="Sanctum Runtime Companion — mobile trust control for autonomous AI: verifications, monitoring, and approvals."
    />
    <meta name="theme-color" content="#0b1120" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sanctum" />

    <!-- Search-engine indexing: operator console is intentionally not a
         public destination. Indexable product content lives on the
         marketing site. Declared at multiple layers (meta, googlebot,
         X-Robots-Tag HTTP header in render.yaml) so the signal is
         honored even on redirects and cached responses. -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="bingbot" content="noindex, nofollow" />

    <!-- PWA -->
    <meta name="theme-color" content="#070b14" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sanctum" />
    <meta name="application-name" content="Sanctum" />
    <meta name="msapplication-TileColor" content="#070b14" />

    <link rel="canonical" href="https://console.sanctumruntime.com/" />
    <meta property="og:title" content="Sanctum Runtime — Console" />
    <meta
      property="og:description"
      content="Mission control for trusted autonomous AI — verifications, policies, and fleet operations."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://console.sanctumruntime.com/" />
    <meta property="og:image" content="https://www.sanctumruntime.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.sanctumruntime.com/og.png" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <!-- iOS splash screens (covers iPhone SE → iPhone 16 Pro Max) -->
    <link rel="apple-touch-startup-image" href="/apple-touch-icon.png" media="(device-width:390px) and (device-height:844px) and (-webkit-device-pixel-ratio:3)" />
    <link rel="apple-touch-startup-image" href="/apple-touch-icon.png" media="(device-width:430px) and (device-height:932px) and (-webkit-device-pixel-ratio:3)" />
    <link rel="apple-touch-startup-image" href="/apple-touch-icon.png" media="(device-width:375px) and (device-height:812px) and (-webkit-device-pixel-ratio:3)" />
    <link rel="apple-touch-startup-image" href="/apple-touch-icon.png" media="(device-width:414px) and (device-height:896px) and (-webkit-device-pixel-ratio:2)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
