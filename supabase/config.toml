# Sanctum — linked Supabase project (remote DB + auth)
# https://supabase.com/docs/guides/cli/config

project_id = "nimvcudvrhanxlcpiizz"

[db]
major_version = 17

[api]
enabled = true
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[auth]
enabled = true
site_url = "https://console.sanctumruntime.com"
additional_redirect_urls = [
  "http://127.0.0.1:5174/**",
  "https://console.sanctumruntime.com/**",
  "https://*.onrender.com/**",
]

[studio]
enabled = true

# Creem billing — secrets in Supabase (docs/CREEM_SUPABASE.md), not Render
[functions.creem-webhook]
verify_jwt = false

[functions.creem-checkout]
verify_jwt = true

[functions.creem-sync]
verify_jwt = true

[functions.creem-portal]
verify_jwt = true

[functions.creem-verify]
verify_jwt = false
