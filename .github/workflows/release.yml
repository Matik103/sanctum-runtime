name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-sdk:
    name: Publish @sanctum-runtime/sdk to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: |
          npm run build -w @sanctum-runtime/sdk
          npm run build -w @sanctum-runtime/adapter-agent-runtime

      - name: Publish SDK to npm
        continue-on-error: true
        run: npm publish -w @sanctum-runtime/sdk --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish adapter to npm
        run: npm publish -w @sanctum-runtime/adapter-agent-runtime --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
