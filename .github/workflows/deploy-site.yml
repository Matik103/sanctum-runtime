name: Deploy marketing site

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "vite.config.ts"
      - "vite.config.vercel.ts"
      - "vercel.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

jobs:
  vercel:
    name: Vercel (www.sanctumruntime.com)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Check Vercel secrets
        id: vercel
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::www.sanctumruntime.com is served by Vercel (DNS). Add GitHub secrets VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID — or redeploy from the Vercel dashboard."
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Install dependencies
        if: steps.vercel.outputs.skip != 'true'
        run: npm ci

      - name: Build site (Vercel / Nitro)
        if: steps.vercel.outputs.skip != 'true'
        run: npm run build:vercel
        env:
          VITE_CONSOLE_URL: https://console.sanctumruntime.com/
          VITE_MARKETING_URL: https://www.sanctumruntime.com/
          VITE_GITHUB_URL: https://github.com/Matik103/sanctum-runtime

      - name: Deploy to Vercel production
        if: steps.vercel.outputs.skip != 'true'
        run: npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  cloudflare:
    name: Cloudflare Workers (optional mirror)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Skip when Cloudflare secrets missing
        id: cf
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare secrets not set — skipping mirror deploy"
          fi

      - name: Build site (Cloudflare)
        if: steps.cf.outputs.skip != 'true'
        run: npm run build
        env:
          VITE_CONSOLE_URL: https://console.sanctumruntime.com/
          VITE_MARKETING_URL: https://www.sanctumruntime.com/
          VITE_GITHUB_URL: https://github.com/Matik103/sanctum-runtime

      - name: Deploy to Cloudflare
        if: steps.cf.outputs.skip != 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
