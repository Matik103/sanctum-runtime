# Required gate before Render deploy (.github/workflows/deploy-render.yml).
# Branch protection on main should require both jobs below to pass.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build SDK and packages (matches Render API build)
        run: npm run build:packages

      - name: Typecheck (dashboard)
        run: npx tsc --project apps/dashboard/tsconfig.json --noEmit

      - name: Unit tests
        run: npm test -- --reporter=verbose

  runtime:
    name: Build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Create CI .env
        run: |
          cat > .env <<'EOF'
          HOST=127.0.0.1
          PORT=3001
          SANCTUM_OFFLINE_MODE=true
          DASHBOARD_HOST=127.0.0.1
          DASHBOARD_PORT=5174
          SITE_HOST=127.0.0.1
          SITE_PORT=8080
          OLLAMA_URL=http://127.0.0.1:11434
          OLLAMA_MODEL=qwen2.5-0.5b-instruct
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Build SDK and packages (matches Render API build)
        run: npm run build:packages

      - name: Build dashboard (matches Render static site build)
        run: npm run build:dashboard

      - name: Start API
        run: |
          npm run dev:api &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3001/health >/dev/null; then
              echo "API ready"
              exit 0
            fi
            sleep 1
          done
          echo "API failed to start"
          exit 1

      - name: Smoke test
        run: npm run smoke
