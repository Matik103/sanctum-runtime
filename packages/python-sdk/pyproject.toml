[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sanctum-runtime"
version = "0.1.1"
description = "Sanctum Runtime SDK for Python — verify agent actions before execution (approve, verify, block)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Sanctum" }]
keywords = [
  "ai-agents",
  "llm-security",
  "guardrails",
  "policy-engine",
  "human-in-the-loop",
  "robotics",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.urls]
Homepage = "https://github.com/Matik103/sanctum-runtime"
Repository = "https://github.com/Matik103/sanctum-runtime"
Documentation = "https://github.com/Matik103/sanctum-runtime/blob/main/DEVELOPER_GUIDE.md"

[tool.hatch.build.targets.wheel]
packages = ["sanctum_runtime"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
